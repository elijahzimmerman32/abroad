plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.abroadai'
version = '0.1.0'

android {
  namespace "expo.modules.abroadai"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Gemini Nano through ML Kit's Prompt API. Runs on the phone, free, no account.
  implementation "com.google.mlkit:genai-prompt:1.0.0-beta4"
}
